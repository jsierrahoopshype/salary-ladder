<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--__BUILT__-->
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<link rel="canonical" href="https://hoopsmatic.com/salary-ladder/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HoopsMatic">
<meta property="og:title" content="{{meta.ogTitle}}">
<meta property="og:description" content="{{meta.ogDescription}}">
<meta property="og:url" content="https://hoopsmatic.com/salary-ladder/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0a0a1a">
<!-- The Salary Finder's font request (DM Sans, JetBrains Mono) plus Oswald, 73-9's heading font: one request, same provider. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <h1>{{app.name}}</h1>
  </header>

  <p id="loading" class="loading">{{app.loading}}</p>

  <section id="intro" class="screen intro" hidden>
    <p id="i-tagline" class="tagline"></p>
    <p id="i-streak" class="streak" hidden></p>
    <ol id="i-howto" class="howto"></ol>
    <div class="actions">
      <button id="i-daily" class="btn" type="button"></button>
      <button id="i-unlimited" class="btn ghost" type="button"></button>
    </div>
    <p class="fine">{{intro.modes}}</p>
    <p id="i-foot" class="fine"></p>
  </section>

  <section id="play" class="screen play" hidden>
    <div class="hud">
      <div class="hud-left">
        <span class="hud-title">{{app.name}}</span>
        <div class="hud-sub">
          <span id="p-hearts" class="hearts" role="img"></span>
          <span id="p-mode" class="mode"></span>
        </div>
      </div>
      <div class="pills">
        <span class="pill rung"><span class="lbl">{{play.rung}}</span><b id="p-rung">0</b></span>
        <span class="pill"><span class="lbl">{{play.score}}</span><b id="p-score"></b></span>
      </div>
    </div>
    <p class="question">{{play.question}}</p>
    <div class="duel">
      <button id="card-inc" class="pcard" type="button"></button>
      <button id="card-ch" class="pcard" type="button"></button>
    </div>
    <div id="timer" class="timer" aria-hidden="true">
      <div class="bar"><i id="t-bar"></i></div>
      <span id="t-secs" class="secs"></span>
    </div>
    <p id="p-result" class="result" aria-live="polite"></p>
    <p class="keys">{{play.keys}}</p>
  </section>

  <section id="end" class="screen end" hidden>
    <div class="res-record">
      <h2 id="e-score" class="end-score"></h2>
      <p id="e-grade" class="grade" hidden></p>
    </div>
    <p id="e-sub" class="res-sub"></p>

    <div class="war-panel">
      <div id="e-player" class="reached"></div>
      <p id="e-best" class="best"></p>
      <p id="e-rank" class="resting"></p>
    </div>

    <div class="actions">
      <button id="e-share" class="btn" type="button">{{end.share}}</button>
      <button id="e-boards" class="btn ghost" type="button" hidden>{{board.open}}</button>
      <button id="e-next" class="btn ghost" type="button"></button>
      <button id="e-home" class="btn ghost" type="button">{{end.home}}</button>
    </div>

    <div id="e-contract" class="sq contract">
      <p class="sq-hdr">{{contract.question}}</p>
      <div id="e-contract-opts" class="opts"></div>
      <p id="e-contract-msg" class="msg" aria-live="polite"></p>
    </div>

    <form id="e-name" class="sq namebox" autocomplete="off">
      <label for="e-name-input">{{name.label}}</label>
      <div class="row">
        <input id="e-name-input" name="name" maxlength="24" placeholder="{{name.placeholder}}" required>
        <input id="e-handle-input" name="handle" maxlength="31" placeholder="{{name.handlePlaceholder}}">
      </div>
      <button class="btn btn-sm" type="submit">{{name.save}}</button>
      <p id="e-name-msg" class="msg" aria-live="polite"></p>
    </form>

    <p id="e-foot" class="fine"></p>
  </section>
</div>
<noscript><p class="loading">{{app.noscript}}</p></noscript>
<script type="module">
/*__SCRIPT__*/
</script>
</body>
</html>
