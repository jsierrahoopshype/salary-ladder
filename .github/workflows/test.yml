name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/sources
      - name: Run tests (including the real-data check)
        run: REAL_FINDER="$FINDER" REAL_HEADSHOTS="$HEADSHOTS" node --test
