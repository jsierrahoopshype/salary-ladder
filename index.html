<style>
/* Salary Ladder. Colours, type, panels, cards, buttons, share modal and end
   screen copied from the 73-9 game (BoxScoreLab box_score_lab_roulette.html,
   live at hoopsmatic.com/73-9-game), the look the Daily 73-9 also uses.

   Fonts: headings in Oswald, as in 73-9 (approved October 13, 2026), body in
   JetBrains Mono. Both come in the one Google Fonts request in page/index.html
   that also loads DM Sans, the Salary Finder's font, kept as the fallback. */

:root{
  --gold:#ffd700;--orange:#ff6b35;--green:#34d97a;--amber:#ffd24a;--red:#ff6666;
  --ink:#c8c8e0;--dim:#8888aa;--panel:#12122a;--panel2:#0c0c1e;--line:#2a2a52;
  --white:#eaeaff;
  --display:'Oswald','DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0a0a1a}
body{background:linear-gradient(160deg,#1a1a3e 0%,#0a0a1a 55%,#050510 100%);background-attachment:fixed;
  color:var(--ink);font-family:var(--mono);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
body.playing{overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@keyframes shimmer{0%,100%{background-position:0 0}50%{background-position:200% 0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}

.app{max-width:34rem;margin:0 auto;padding:.9rem max(.85rem,env(safe-area-inset-right)) 2rem max(.85rem,env(safe-area-inset-left))}
body.playing .app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:.6rem;padding-bottom:max(.6rem,env(safe-area-inset-bottom))}

/* Title: the big shimmering 73-9 logo on the intro, the small HUD title elsewhere. */
.hdr{text-align:center}
.hdr h1,.hud-title{font-family:var(--display);font-weight:700;text-transform:uppercase;
  background:linear-gradient(135deg,var(--orange) 0%,var(--gold) 50%,var(--orange) 100%);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr h1{font-size:clamp(30px,9.4vw,46px);letter-spacing:.09em;line-height:1.05;animation:shimmer 3s ease-in-out infinite}
body[data-screen="end"] .hdr{margin-bottom:18px}
body[data-screen="end"] .hdr h1{font-size:clamp(24px,7vw,32px)}
body.playing .hdr{display:none}
@media(prefers-reduced-motion:reduce){.hdr h1{animation:none}}

.loading{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:.8rem}
.fine{font-size:11px;color:#6a6a8c;letter-spacing:.5px;margin-top:18px;text-align:center}
.fine + .fine{margin-top:6px}
.lbl{font-family:var(--display);font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:2px}
.msg{font-size:12px;color:var(--green);min-height:16px;margin-top:.4rem;text-align:center}
.msg.err{color:var(--red)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:var(--display);font-weight:700;
  letter-spacing:2px;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;padding:14px 26px;font-size:15px;
  background:linear-gradient(135deg,var(--orange),var(--gold));color:#1a1006;box-shadow:0 6px 18px rgba(255,107,53,.25);
  transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid #4a4a7a;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
@media(hover:hover){
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,107,53,.35)}
  .btn.ghost:hover{border-color:var(--gold);box-shadow:none}
}
.btn-sm{padding:9px 16px;font-size:12px;letter-spacing:1px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* intro */
.intro{text-align:center;animation:fadeIn .4s}
.tagline{font-family:var(--display);font-size:12px;font-weight:600;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin:10px 0 0}
.streak{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.3px;color:#1a1206;
  background:linear-gradient(135deg,#ffe08a,#ffc24d);border-radius:8px;padding:4px 10px;margin-top:16px}
.howto{list-style:none;counter-reset:n;margin:22px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;text-align:left;font-size:13px;line-height:1.7}
.howto li{counter-increment:n;position:relative;padding:4px 0 4px 32px}
.howto li::before{content:counter(n);position:absolute;left:0;top:7px;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;
  background:var(--orange);color:#1a1006;font-family:var(--display);font-weight:700;font-size:12px}
.howto b{color:var(--gold)}
.intro .actions{flex-direction:column;align-items:stretch;margin-top:24px}

/* play: the HUD (73-9 .hud) */
.play{flex:1;min-height:0;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px}
.hud-left{display:flex;flex-direction:column;gap:6px;min-width:0}
.hud-sub{display:flex;align-items:center;gap:8px}
.hud-title{font-size:14px;letter-spacing:3px;white-space:nowrap;background:linear-gradient(90deg,var(--orange),var(--gold));
  -webkit-background-clip:text;background-clip:text}
.mode{border:1px solid rgba(255,215,0,.3);color:#9a9ac4;border-radius:6px;height:20px;line-height:18px;font-size:10px;
  font-family:var(--display);font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:0 7px;white-space:nowrap}
.hearts{font-size:15px;line-height:1;letter-spacing:2px;white-space:nowrap}
.hearts .full{color:var(--red)}
.hearts .empty{color:#2f2f58}
.pills{display:flex;gap:6px;flex:none}
.pill{font-size:13px;font-weight:600;letter-spacing:.5px;padding:6px 10px;background:#0a1a14;border:1px solid #34d97a55;color:var(--green);
  border-radius:8px;white-space:nowrap;text-align:right}
.pill .lbl{display:block;color:#5fae85;margin-bottom:1px}
.pill.rung{background:#1a1408;border-color:#ffd70040;color:var(--gold)}
.pill.rung .lbl{color:#b59a4a}

.question{text-align:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);margin:.65rem 0 .5rem}

/* the two player cards (73-9 .pick-card) */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0;
  background:linear-gradient(160deg,#16162f,#0e0e22);border:1px solid var(--line);border-radius:10px;padding:9px 8px 10px;
  cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.pcard:not(.revealed):hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(255,215,0,.12)}}
.pcard .role{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--orange);
  background:#2a1a10;border:1px solid #4a2e18;padding:2px 7px;border-radius:5px}
/* Headshot frame: the 73-9 reel window (dark radial well, inner line) with
   the same drop shadow 73-9 puts on its logos. */
.pcard .face{position:relative;display:block;width:min(100%,clamp(84px,26dvh,190px));aspect-ratio:1;margin:5px 0 3px;
  border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#22224a,#0a0a1e 75%);border:1px solid #26264c}
.pcard .face img{width:100%;height:100%;object-fit:cover;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.pcard .initials{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:1px;color:#cfcff0}
.face.noimg img{visibility:hidden}
/* the team logo when no photo loads: whole, centred, as the Daily 73-9 shows it */
.face.is-logo img{object-fit:contain;padding:16%}
.pcard .face.noimg .initials{display:flex}
.pcard .pname{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;color:var(--white);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.pcard .pmeta{display:block;font-size:10.5px;line-height:1.35;color:#9b9bc2;letter-spacing:.2px;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .team{display:flex;align-items:center;justify-content:center;gap:5px}
.pcard .team span{overflow:hidden;text-overflow:ellipsis}
.pcard .logo{width:16px;height:16px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pcard .sal{font-family:var(--display);font-weight:700;font-size:20px;color:var(--gold);min-height:26px;line-height:26px;margin-top:2px;
  opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.pcard .gap{font-size:10.5px;color:#9b9bc2;min-height:15px;opacity:0;transition:opacity .18s}
.pcard .more{visibility:hidden;font-family:var(--display);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  margin-top:2px;padding:2px 7px;border-radius:5px;color:var(--green);background:#0e2018;border:1px solid #1d4030}
.pcard .mark{display:none;position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#0a0a1a}
.pcard.revealed{cursor:default}
.pcard.revealed .sal{opacity:1;transform:none}
.pcard.revealed .gap{opacity:1}
.pcard.richer .more{visibility:visible}
.pcard.right{border-color:var(--green);background:linear-gradient(160deg,#10301f,#0b1a14);box-shadow:0 0 18px rgba(52,217,122,.18)}
.pcard.right .mark{display:flex;background:var(--green)}
.pcard.wrong{border-color:var(--red);background:linear-gradient(160deg,#341418,#1a0c10);box-shadow:0 0 18px rgba(255,102,102,.16)}
.pcard.wrong .mark{display:flex;background:var(--red)}

.pcard.enter{animation:enter .24s ease-out both}
.pcard.climb{animation:climb .24s ease-out both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}}
@keyframes climb{from{transform:translateX(calc(100% + 10px))}}
@media(prefers-reduced-motion:reduce){.pcard.enter,.pcard.climb{animation:none}.pcard .sal{transition:none}}

/* timer: the 73-9 progress bar */
.timer{display:flex;align-items:center;gap:10px;margin-top:12px}
.timer .bar{flex:1;height:8px;border-radius:6px;background:#1c1c3a;border:1px solid var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));transform-origin:left;transform:scaleX(1)}
.timer .secs{font-weight:700;font-size:14px;min-width:2.4rem;text-align:right;color:var(--gold)}
.timer.warn .bar i{background:var(--red)}
.timer.warn .secs{color:var(--red)}
.timer.idle .bar i{background:#3a3a62}
.timer.idle .secs{color:var(--dim)}
.result{text-align:center;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;
  min-height:22px;margin-top:9px}
.result.ok{color:var(--green)}
.result.bad{color:var(--red)}
.keys{display:none;text-align:center;font-size:11px;color:#6a6a8c;margin-top:auto;padding-top:.4rem}
@media(hover:hover) and (pointer:fine){.keys{display:block}}

/* end screen (73-9 results) */
.end{animation:fadeIn .45s}
.res-record{text-align:center;margin:6px 0 4px}
.end-score{font-family:var(--display);font-size:clamp(48px,15vw,68px);font-weight:700;line-height:1;letter-spacing:1px;color:#fff}
.grade{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:2px;font-size:13px;padding:5px 16px;
  border-radius:20px;text-transform:uppercase;margin-top:10px}
.grade.top{color:var(--gold);background:#2a230e;border:1px solid #ffd70055}
.grade.best{color:var(--green);background:#0e2018;border:1px solid #34d97a55}
.res-sub{text-align:center;font-size:12px;color:var(--dim);letter-spacing:.5px;margin:12px 0 16px}
.res-sub b{color:var(--white)}
.war-panel{padding:16px 18px;border-radius:14px;background:linear-gradient(160deg,rgba(30,42,92,.5),rgba(10,12,30,.5));
  border:1px solid #ffd70033;text-align:center}
.reached{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.reached .face{width:64px;height:64px;flex:none;border-radius:10px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#22224a,#0a0a1e 75%);border:1px solid #26264c}
.reached .face img{width:100%;height:100%;object-fit:cover;display:block}
.reached .pname{font-family:var(--display);font-weight:700;font-size:18px;color:#fff;line-height:1.15}
.reached .pmeta{font-size:11px;color:#9b9bc2;margin-top:2px}
.best{font-family:var(--display);font-size:13px;letter-spacing:.4px;color:#bcbce6;margin-top:12px}
.best b{color:var(--gold);font-weight:700}
.resting{font-family:var(--display);font-size:12px;letter-spacing:.4px;color:#8a8ab8;margin-top:8px}

.sq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-top:16px}
.sq-hdr{font-family:var(--display);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:#cfcff0;
  text-align:center;margin-bottom:12px}
.contract .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contract .opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;cursor:pointer;text-align:center;
  background:linear-gradient(160deg,#16162f,#0e0e22);border:1px solid var(--line);border-radius:10px;transition:transform .12s,border-color .12s}
@media(hover:hover){.contract .opt:not(:disabled):hover{transform:translateY(-3px);border-color:var(--gold)}}
.contract .opt .face{width:52px;height:52px;border-radius:8px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#22224a,#0a0a1e 75%);border:1px solid #26264c}
.contract .opt img{width:100%;height:100%;object-fit:cover;display:block}
.contract .opt .pname{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.15;color:var(--white)}
.contract .opt .sal{font-family:var(--display);font-weight:700;font-size:15px;color:var(--gold)}
.contract .opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.contract .opt:disabled{cursor:default}
.contract .opt:disabled:not([aria-pressed="true"]){opacity:.45}

.namebox label{display:block;font-family:var(--display);color:#ffd166;font-size:13px;margin-bottom:10px;text-align:center}
.namebox .row{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.namebox input{width:100%;background:#0f0f24;border:1px solid var(--line);border-radius:8px;color:#fff;
  font-family:var(--mono);font-size:16px;padding:8px 10px}
.namebox input::placeholder{color:#5c5c82}
.namebox .btn{display:flex;margin:0 auto}

/* share modal (73-9 .share-modal) */
.share-modal{position:fixed;inset:0;z-index:100;background:rgba(5,5,16,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s;overflow-y:auto}
.share-box{position:relative;width:min(92vw,440px);display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.share-img{width:auto;max-width:100%;max-height:44vh;max-height:44dvh;object-fit:contain;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.share-x{position:absolute;top:-14px;right:-8px;width:40px;height:40px;border-radius:50%;border:none;background:#1a1a3e;color:#fff;
  font-size:24px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:1}
.share-link{display:flex;width:100%;gap:8px}
.share-url{flex:1;min-width:0;background:#0f0f24;border:1px solid var(--line);border-radius:10px;color:#cfcff0;font-family:var(--mono);
  font-size:12px;padding:10px 12px}
.share-copybtn{flex:none;background:var(--gold);color:#1a1a2e;border:none;border-radius:10px;padding:0 16px;font-family:var(--display);
  font-weight:700;font-size:14px;cursor:pointer}
.share-social{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.soc{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border-radius:10px;border:none;color:#fff;
  font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.3px;cursor:pointer;transition:transform .08s,filter .15s}
@media(hover:hover){.soc:hover{transform:translateY(-1px);filter:brightness(1.12)}}
.soc svg{width:17px;height:17px;flex:none}
.soc-x{background:#000;border:1px solid #333}
.soc-bsky{background:#0a85ff}
.soc-fb{background:#1877f2}
.soc-wa{background:#25d366}
.soc-reddit{background:#ff4500}
.soc-telegram{background:#26a5e4}
.share-btns{display:flex;gap:8px;justify-content:center}
.share-btns .btn{padding:13px 14px;font-size:12px;letter-spacing:.5px;white-space:nowrap}
.share-msg{font-size:12px;color:var(--green);min-height:16px;text-align:center}

@media(max-height:560px){
  .question{margin:.35rem 0}
  .pcard .face{width:min(100%,clamp(64px,21dvh,190px))}
  .timer{margin-top:8px}
}
@media(max-width:370px){
  .hud{padding:8px 9px;gap:6px}
  .hud-title{font-size:12px;letter-spacing:2px}
  .pill{padding:5px 7px;font-size:12px}
  .hearts{font-size:14px;letter-spacing:1px}
  .soc{font-size:12px;gap:5px;padding:10px 4px}
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <h1>Salary Ladder</h1>
  </header>

  <p id="loading" class="loading">Loading salaries…</p>

  <section id="intro" class="screen intro" hidden>
    <p id="i-tagline" class="tagline"></p>
    <p id="i-streak" class="streak" hidden></p>
    <ol id="i-howto" class="howto"></ol>
    <div class="actions">
      <button id="i-daily" class="btn" type="button"></button>
      <button id="i-unlimited" class="btn ghost" type="button"></button>
    </div>
    <p class="fine">Daily: the same ladder for everyone, one play a day, new at 9 AM ET. Unlimited: as many games as you like.</p>
    <p id="i-foot" class="fine"></p>
  </section>

  <section id="play" class="screen play" hidden>
    <div class="hud">
      <div class="hud-left">
        <span class="hud-title">Salary Ladder</span>
        <div class="hud-sub">
          <span id="p-hearts" class="hearts" role="img"></span>
          <span id="p-mode" class="mode"></span>
        </div>
      </div>
      <div class="pills">
        <span class="pill rung"><span class="lbl">Rung</span><b id="p-rung">0</b></span>
        <span class="pill"><span class="lbl">Score</span><b id="p-score"></b></span>
      </div>
    </div>
    <p class="question">Who gets paid more?</p>
    <div class="duel">
      <button id="card-inc" class="pcard" type="button"></button>
      <button id="card-ch" class="pcard" type="button"></button>
    </div>
    <div id="timer" class="timer" aria-hidden="true">
      <div class="bar"><i id="t-bar"></i></div>

<script type="module">
// ---- shared/game.js ----
// Salary Ladder game logic, shared by the page, the server Workers, the
// daily builders and the simulator. One copy, so the browser and the server
// can never disagree about what a game was. No dependencies, no Date.now(),
// no Math.random(): everything random comes from the seed.
//
// Pool entries look like {id, name, team, pos, born, salary, img}.

const LOGIC_VERSION = 1;

const CHOICE = Object.freeze({ INCUMBENT: 0, CHALLENGER: 1, TIMEOUT: 2 });

// ---------------------------------------------------------------------------
// Seeded randomness. cyrb128 turns any string into four 32-bit words and
// sfc32 turns those into a stream of floats in [0, 1). Both are plain
// integer arithmetic, so Node, browsers and Workers produce identical numbers.

function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0; i < str.length; i++) {
    const k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= h2 ^ h3 ^ h4; h2 ^= h1; h3 ^= h1; h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}

function sfc32(a, b, c, d) {
  return function () {
    a |= 0; b |= 0; c |= 0; d |= 0;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

function makeRng(...parts) {
  const [a, b, c, d] = cyrb128(parts.join(':'));
  const rng = sfc32(a, b, c, d);
  for (let i = 0; i < 12; i++) rng(); // let the state mix before use
  return rng;
}

function pickOne(rng, list) {
  return list[Math.floor(rng() * list.length)];
}

// ---------------------------------------------------------------------------
// Pool

/** Sorts the pool by salary (then NBA ID) and indexes it by ID. */
function preparePool(players) {
  const sorted = [...players].sort((a, b) => a.salary - b.salary || a.id - b.id);
  const byId = new Map(sorted.map((p) => [p.id, p]));
  if (byId.size !== sorted.length) throw new Error('duplicate NBA ID in pool');
  const top = sorted[sorted.length - 1].salary;
  return { sorted, byId, top };
}

// First index whose salary is >= value.
function lowerBound(sorted, value) {
  let lo = 0, hi = sorted.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (sorted[mid].salary < value) lo = mid + 1; else hi = mid;
  }
  return lo;
}

// First index whose salary is > value.
function upperBound(sorted, value) {
  let lo = 0, hi = sorted.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (sorted[mid].salary <= value) lo = mid + 1; else hi = mid;
  }
  return lo;
}

/** Players with a different salary within ±pct of `salary`. */
function nonTiedNeighbours(pool, salary, pct) {
  const { sorted } = pool;
  const from = lowerBound(sorted, salary * (1 - pct));
  const to = upperBound(sorted, salary * (1 + pct));
  let n = 0;
  for (let i = from; i < to; i++) if (sorted[i].salary !== salary) n++;
  return n;
}

/**
 * Start window (spec 6.2): players between the pct_low and pct_high
 * percentiles of salary with at least min_neighbors non-tied players within
 * ±neighbor_band. If the data ever leaves nobody, the neighbour minimum is
 * lowered one at a time until somebody qualifies, so a game can always start.
 */
function startCandidates(pool, rules) {
  const { sorted } = pool;
  const s = rules.start;
  const n = sorted.length;
  const lo = sorted[Math.floor(s.pct_low * n)].salary;
  const hi = sorted[Math.floor(s.pct_high * n)].salary;
  const inWindow = sorted.filter((p) => p.salary >= lo && p.salary <= hi && p.salary < pool.top);
  for (let need = s.min_neighbors; need >= 0; need--) {
    const ok = inWindow.filter((p) => nonTiedNeighbours(pool, p.salary, s.neighbor_band) >= need);
    if (ok.length) return ok;
  }
  return [sorted[0]];
}

function pickStart(pool, rules, seed) {
  return pickOne(makeRng(seed, 'start'), startCandidates(pool, rules)).id;
}

/**
 * The challenger for a pick (spec 6.1). Depends only on the seed, the pick
 * number, the incumbent and the recently shown players, so anyone making the
 * same choices on the same puzzle sees the same players.
 */
function nextChallenger(pool, rules, seed, pickIndex, incumbentId, recentIds) {
  const { sorted, byId } = pool;
  const inc = byId.get(incumbentId);
  const rng = makeRng(seed, 'pick', pickIndex, incumbentId);
  const wantRicher = rng() < 0.5;

  const from = lowerBound(sorted, inc.salary * (1 - rules.band));
  const to = upperBound(sorted, inc.salary * (1 + rules.band));
  const poorer = [], richer = [];
  for (let i = from; i < to; i++) {
    const p = sorted[i];
    if (p.salary < inc.salary) poorer.push(p);
    else if (p.salary > inc.salary) richer.push(p); // exact ties never paired
  }

  let side = wantRicher ? richer : poorer;
  if (!side.length) {
    // Widen just enough to reach the nearest salary on that side.
    if (wantRicher) {
      const j = upperBound(sorted, inc.salary);
      if (j < sorted.length) side = sorted.filter((p) => p.salary === sorted[j].salary);
    } else {
      const j = lowerBound(sorted, inc.salary) - 1;
      if (j >= 0) side = sorted.filter((p) => p.salary === sorted[j].salary);
    }
  }
  if (!side.length) {
    // Nobody poorer at all: the challenger is richer. (Nobody richer means
    // the incumbent is the top, and the game is already over.)
    side = richer.length ? richer : sorted.filter((p) => p.salary === sorted[upperBound(sorted, inc.salary)]?.salary);
  }
  const recent = new Set(recentIds);
  const fresh = side.filter((p) => !recent.has(p.id));
  return pickOne(rng, fresh.length ? fresh : side).id;
}

// ---------------------------------------------------------------------------
// A game

function newGame({ pool, rules, seed, startId }) {
  const state = {
    seed,
    lives: rules.lives,
    rung: 0,
    incumbent: startId,
    challenger: null,
    pickIndex: 0,
    recent: [],
    picks: [],
    totalMs: 0,
    finished: pool.byId.get(startId).salary >= pool.top,
    over: false,
  };
  if (!state.finished) state.challenger = nextChallenger(pool, rules, seed, 0, startId, []);
  return state;
}

function isDone(state) {
  return state.finished || state.over;
}

/** Applies one pick. choice is a CHOICE value; ms the time the pick took. */
function applyPick(pool, rules, state, choice, ms) {
  if (isDone(state)) throw new Error('game already ended');
  const inc = pool.byId.get(state.incumbent);
  const ch = pool.byId.get(state.challenger);
  const richerIsChallenger = ch.salary > inc.salary;
  const correct =
    choice === CHOICE.CHALLENGER ? richerIsChallenger :
    choice === CHOICE.INCUMBENT ? !richerIsChallenger :
    false; // a timeout is never right

  state.picks.push({ c: choice, ms });
  state.totalMs += ms;
  state.recent.push(ch.id);
  if (state.recent.length > rules.recent_no_repeat) state.recent.shift();

  const result = {
    incumbent: inc.id, challenger: ch.id, choice, correct, ms,
    incumbentSalary: inc.salary, challengerSalary: ch.salary, climbed: false,
  };
  if (correct && choice === CHOICE.CHALLENGER) {
    state.incumbent = ch.id;
    state.rung += 1;
    result.climbed = true;
    if (ch.salary >= pool.top) state.finished = true;
  } else if (!correct) {
    state.lives -= 1;
    if (state.lives <= 0) state.over = true;
  }
  state.pickIndex += 1;
  state.challenger = isDone(state)
    ? null
    : nextChallenger(pool, rules, state.seed, state.pickIndex, state.incumbent, state.recent);
  return result;
}

function score(pool, state) {
  return pool.byId.get(state.incumbent).salary;
}

// ---------------------------------------------------------------------------
// Replay: what the server runs on every finished game (spec 13.1). It checks
// the per-pick time rules here; the "no longer than real server time" rule
// needs the server clock, so the Worker checks that one itself.

function replay({ pool, rules, seed, startId, picks }) {
  const fail = (reason, at) => ({ ok: false, reason, at });
  if (!Array.isArray(picks) || picks.length === 0) return fail('no picks');
  if (!pool.byId.has(startId)) return fail('unknown start player');
  const maxMs = rules.timer_seconds * 1000;

  const state = newGame({ pool, rules, seed, startId });
  const log = [];
  for (let i = 0; i < picks.length; i++) {
    if (isDone(state)) return fail('picks after the game ended', i);
    const p = picks[i];
    if (!p || ![CHOICE.INCUMBENT, CHOICE.CHALLENGER, CHOICE.TIMEOUT].includes(p.c)) return fail('bad choice', i);
    if (!Number.isInteger(p.ms)) return fail('bad time', i);
    if (p.c === CHOICE.TIMEOUT) {
      if (p.ms !== maxMs) return fail('timeout not recorded as the full timer', i);
    } else {
      if (p.ms > maxMs) return fail('pick over the timer without a timeout', i);
      if (p.ms < rules.min_pick_ms) return fail('pick faster than the minimum', i);
    }
    log.push(applyPick(pool, rules, state, p.c, p.ms));
  }
  if (!isDone(state)) return fail('game not finished');
  if (state.totalMs / picks.length < rules.min_avg_ms) return fail('average pick faster than the minimum');

  return {
    ok: true,
    score: score(pool, state),
    rung: state.rung,
    livesLeft: state.lives,
    totalMs: state.totalMs,
    finished: state.finished,
    picks: picks.length,
    endId: state.incumbent,
    log,
  };
}

function T(key, vars = {}) {

}

/**
 * The same, as HTML: the wording is escaped and the values go in as given,
 * so the caller can bold a number (and must escape any value from data).
 */
function TH(key, vars = {}) {
  return (COPY[key] ?? '').split(/(\{\w+\})/).map((part) => {
    const k = /^\{(\w+)\}$/.exec(part)?.[1];
    if (k && k in vars) return String(vars[k]);
    return part.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }).join('');
}

// ---- page/lib.js ----
// Page helpers with no DOM: formatting, the 9 AM ET day, streaks, the share
// card, pick timing and device storage. Tested in Node (test/page.test.mjs);
// tools/build-page.mjs inlines this file into index.html.


// ---------------------------------------------------------------------------
// Dates. Dates are 'YYYY-MM-DD' strings throughout.

function addDaysIso(date, n) {
  const d = new Date(`${date}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

/**
 * The Daily that is live at `now` (spec 10): days turn over at 9:00 AM US
 * Eastern, following daylight saving. Before 9 AM ET it's still yesterday's.
 */
function dailyDate(now = new Date()) {
  const p = {};
  for (const part of new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23',
  }).formatToParts(now)) p[part.type] = part.value;
  const date = `${p.year}-${p.month}-${p.day}`;
  return Number(p.hour) < 9 ? addDaysIso(date, -1) : date;
}

/** 'Oct 9' */
function shortDate(date) {
  return new Date(`${date}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
}

/** Whole years old on `onDate` (spec 8), or null without a birth date. */
function ageOn(born, onDate) {
  if (!born) return null;
  const [by, bm, bd] = born.split('-').map(Number);
  const [y, m, d] = onDate.split('-').map(Number);
  return y - by - (m < bm || (m === bm && d < bd) ? 1 : 0);
}

// ---------------------------------------------------------------------------
// Money and time

/** Three significant figures (spec 8): $2.45M, $31.4M, $62.6M, $679K. */
function money(n) {
  const a = Math.abs(n);
  if (a >= 999500) return `$${(a / 1e6).toPrecision(3)}M`;
  if (a >= 1000) return `$${(a / 1e3).toPrecision(3)}K`;
  return `$${Math.round(a)}`;
}

/** The challenger's salary against the incumbent's: '+$1.23M (+4.1%)'. */
function gapText(incumbentSalary, challengerSalary) {
  const diff = challengerSalary - incumbentSalary;
  const sign = diff < 0 ? '−' : '+';
  const pct = Math.abs(diff / incumbentSalary * 100).toFixed(1);
  return `${sign}${money(diff)} (${sign}${pct}%)`;
}

/** Total time as m:ss. */
function clock(ms) {
  const s = Math.round(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ---------------------------------------------------------------------------
// Picks

/**
 * Turns the time since the timer started into what gets recorded (spec 13.1
 * rules, so an honest game always verifies). Returns null for a tap faster
 * than the minimum, which is ignored; anything at or past the timer is a
 * timeout recorded as exactly the full timer.
 */
function pickTiming(elapsedMs, rules) {
  const max = rules.timer_seconds * 1000;
  if (elapsedMs >= max) return { timeout: true, ms: max };
  const ms = Math.round(elapsedMs);
  if (ms < rules.min_pick_ms) return null;
  return { timeout: false, ms };
}

/** One vote per pair per device (spec 14.1): both NBA IDs and both salaries. */
function pairKey(idA, salaryA, idB, salaryB) {
  return idA < idB ? `${idA}:${salaryA}|${idB}:${salaryB}` : `${idB}:${salaryB}|${idA}:${salaryA}`;
}

// ---------------------------------------------------------------------------
// Streak (spec 10): Daily days in a row, kept only on the device.

/** The streak after the Daily for `date` ends. */
function streakAfter(streak, date) {
  if (streak && streak.last === date) return streak;
  const count = streak && streak.last === addDaysIso(date, -1) ? streak.count + 1 : 1;
  return { count, last: date };
}

/** Streak still alive on `today`: played today or yesterday. */
function liveStreak(streak, today) {
  if (!streak) return 0;
  return streak.last === today || streak.last === addDaysIso(today, -1) ? streak.count : 0;
}

/** True when an active streak is lost unless today's Daily is played. */
function streakAtStake(streak, today) {
  return Boolean(streak && streak.count > 0 && streak.last === addDaysIso(today, -1));
}

// ---------------------------------------------------------------------------
// Share card (spec 9). No player names, so it never spoils the day.

const SITE_URL = 'https://hoopsmatic.com/salary-ladder/';

function shareText({ mode, number, date, score, rung, livesLeft, lives, totalMs }) {
  const head = mode !== 'daily' ? T('shareText.unlimitedHead')
    : T(number ? 'shareText.dailyHead' : 'shareText.dailyHeadNoNumber', { number, date: shortDate(date) });
  const hearts = '❤️'.repeat(Math.max(livesLeft, 0)) + '🖤'.repeat(Math.max(lives - livesLeft, 0));
  return [head, T('shareText.line', { score: money(score), rung }), `${hearts} · ${clock(totalMs)}`, SITE_URL].join('\n');
}

/**
 * The share modal's platform buttons (copied from the 73-9 modal). Each opens
 * the platform's own compose page with the share card text; nothing loads
 * until the player taps one. As in 73-9, X and Bluesky also tag HoopsHype.
 */
const HANDLES = { x: '@hoopshype', bsky: '@hoopshypeofficial.bsky.social' };

function shareLinks(text) {
  const lines = text.split('\n').filter((l) => l !== SITE_URL);
  const body = lines.join('\n');
  const e = encodeURIComponent, u = e(SITE_URL), t = e(body), all = e(`${body}\n${SITE_URL}`);
  return {
    x: `https://twitter.com/intent/tweet?text=${e(`${body}\n${HANDLES.x}`)}&url=${u}`,
    bsky: `https://bsky.app/intent/compose?text=${e(`${body}\n${HANDLES.bsky}\n${SITE_URL}`)}`,
    fb: `https://www.facebook.com/sharer/sharer.php?u=${u}&quote=${t}`,
    wa: `https://wa.me/?text=${all}`,
    reddit: `https://www.reddit.com/submit?url=${u}&title=${e(lines.join(' · '))}`,
    telegram: `https://t.me/share/url?url=${u}&text=${t}`,
  };
}

// ---------------------------------------------------------------------------
// Device storage (spec 16). Every read and write is wrapped, so the game
// still plays when the browser blocks storage; things just aren't remembered.

const PREFIX = 'salary-ladder:';

const store = {
  get(key, fallback = null) {
    try {
      const raw = globalThis.localStorage.getItem(PREFIX + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(key, value) {
    try { globalThis.localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; } catch { return false; }
  },
  remove(key) {
    try { globalThis.localStorage.removeItem(PREFIX + key); } catch { /* storage blocked */ }
  },
};

/** Random hex string from the browser's crypto. */
function randomHex(bytes = 16) {
  const a = new Uint8Array(bytes);
  globalThis.crypto.getRandomValues(a);
  return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
}

// ---------------------------------------------------------------------------
// Names (spec 12.2). The full name filter runs on the server (B2); the page
// only trims and checks the length, and cleans the @handle.

function cleanName(name) {
  const n = String(name ?? '').replace(/\s+/g, ' ').trim();
  return n.length >= 2 && n.length <= 24 ? n : null;
}

function cleanHandle(handle) {
  const h = String(handle ?? '').trim().replace(/^@+/, '').replace(/[^A-Za-z0-9_.]/g, '').slice(0, 30);
  return h ? `@${h}` : '';
}

// ---- page/app.js ----
// The Salary Ladder page (build plan B1). Plays the whole game in the
// browser with the shared game logic; the server only verifies and ranks.
// tools/build-page.mjs inlines this file, page/lib.js and shared/game.js
// into index.html, so the page is one file.


const HEADSHOTS = 'https://jsierrahoopshype.github.io/nba-headshots/players/headshots/';
// Headshot crops, best first; each one that fails falls back to the next,
// then to the team logo (as the Daily 73-9 does), then to initials. The data
// files name each player's face-tight file; the other
// crops share its file name. Play cards use face2, as the Daily 73-9 does
// (every head the same size and position), then the regular face crop. When
// the mid-size face2 WebP lands in nba-headshots, it goes first in CARD_CROPS.
const CARD_CROPS = [['face2', 'png'], ['face', 'png']];
// Small spots (end screen, contract pick): face2-160, the same framing at 160px.
const SMALL_CROPS = [['face2-160', 'webp'], ['face', 'png']];
const crop = (p, dir, ext) => `${HEADSHOTS}${dir}/${p.img.split('/').pop().replace(/\.\w+$/, '')}.${ext}`;
const LOGOS = 'https://jsierrahoopshype.github.io/nba-headshots/teams/logos/current/svg/';
const logoUrl = (p) => `${LOGOS}${p.team.toLowerCase()}.svg`;
/** Every picture to try for a player, in order: the crops, then the team logo. */
const photoUrls = (p, crops = CARD_CROPS) => [...crops.map(([dir, ext]) => crop(p, dir, ext)), logoUrl(p)];
function faceImg(p, small = false) {
  const [src, ...rest] = photoUrls(p, small ? SMALL_CROPS : CARD_CROPS);
  return `<img src="${esc(src)}" data-fallback="${esc(rest.join(' '))}" alt=""${small ? '' : ' decoding="async"'}>`;
}

// A headshot that fails moves to its next picture; the team logo is shown
// whole rather than cropped. When nothing is left, the frame shows initials
// (play cards) or stays empty. Capturing, because image errors don't bubble.
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.closest('.face')) return;
  const rest = (img.dataset.fallback ?? '').split(' ').filter(Boolean);
  if (rest.length) {
    img.src = rest.shift();
    img.dataset.fallback = rest.join(' ');
    img.closest('.face').classList.toggle('is-logo', img.src.startsWith(LOGOS));
  } else {
    img.closest('.face').classList.add('noimg');
  }
}, true);
// Build plan C2 points this at https://hoopsmatic.com/salary-ladder/api/.
// Until then the page plays without a server and says rankings are resting.
const API_BASE = null;
const ENTER_MS = 240;       // card entrance animation (style.css)
const IMAGE_WAIT_MS = 2000; // longest wait for a headshot before the clock starts anyway

const TEAMS = {
  ATL: 'Hawks', BKN: 'Nets', BOS: 'Celtics', CHA: 'Hornets', CHI: 'Bulls', CLE: 'Cavaliers', DAL: 'Mavericks',
  DEN: 'Nuggets', DET: 'Pistons', GSW: 'Warriors', HOU: 'Rockets', IND: 'Pacers', LAC: 'Clippers', LAL: 'Lakers',
  MEM: 'Grizzlies', MIA: 'Heat', MIL: 'Bucks', MIN: 'Timberwolves', NOP: 'Pelicans', NYK: 'Knicks', OKC: 'Thunder',
  ORL: 'Magic', PHI: '76ers', PHX: 'Suns', POR: 'Trail Blazers', SAC: 'Kings', SAS: 'Spurs', TOR: 'Raptors',
  UTA: 'Jazz', WAS: 'Wizards',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// Loaded data: today's Daily (or the preview stand-in), the live rules file
// and the prepared pool.
const D = { today: null, daily: null, rules: null, pool: null, preview: false, nextSeed: null };
// The game on screen: {g: saved game, state, last, armed, t0, timer, turn}.
let G = null;

// ---------------------------------------------------------------------------
// Server (build plan B2/C2). Off until API_BASE is set; `recording: false` in
// the rules file also switches it off. Every failure means "Rankings are
// resting" and play carries on (spec 18.2).

const serverOn = (rules) => Boolean(API_BASE) && rules.recording !== false;

// ---------------------------------------------------------------------------
// Loading

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

async function load() {
  D.today = dailyDate();
  const [rules, daily] = await Promise.all([
    getJson('rules/rules.json'),
    getJson(`daily/${D.today}.json`).catch(() => null),
  ]);
  D.rules = rules;
  if (daily) {
    D.daily = daily;
  } else {
    // No Daily files until the daily job is switched on (build plan C2):
    // a preview Daily from the preview pool, the same for everyone that day.
    const snap = await getJson('preview/snapshot.json');
    const seed = `preview:${D.today}`;
    D.daily = {
      date: D.today, number: null, season: snap.season, salaries_as_of: snap.date, rules, seed,
      start: pickStart(preparePool(snap.players), rules, seed), players: snap.players,
    };
    D.preview = true;
  }
  D.pool = preparePool(D.daily.players);
}

// ---------------------------------------------------------------------------
// Saved games. A game in progress is saved after every pick, and marked
// `pending` while a pick's clock runs, so a reload mid-pick counts that pick
// as a timeout (spec 7) and the game resumes from there.

const liveKey = (mode) => `live-${mode}`;

function resumable(g) {
  if (!g) return false;
  // A Daily belongs to its day; an Unlimited game to the salaries it started with.
  return g.mode === 'daily' ? g.date === D.daily.date : g.dataDate === D.daily.salaries_as_of;
}

function rebuild(g) {
  const state = newGame({ pool: D.pool, rules: g.rules, seed: g.seed, startId: g.startId });
  let last = null;
  for (const p of g.picks) last = applyPick(D.pool, g.rules, state, p.c, p.ms);
  return { state, last };
}

/** Applies the reload rule to a saved game. Returns the game, or null. */
function settle(mode) {
  const g = store.get(liveKey(mode));
  if (!resumable(g)) { store.remove(liveKey(mode)); return null; }
  if (g.pending) {
    g.picks.push({ c: CHOICE.TIMEOUT, ms: g.rules.timer_seconds * 1000 });
    g.pending = false;
    store.set(liveKey(mode), g);
  }
  return g;
}

function dailyResult() {
  const d = store.get('daily');
  return d && d.date === D.daily.date ? d.summary : null;
}

// ---------------------------------------------------------------------------
// Intro

function showScreen(id) {
  for (const s of ['loading', 'intro', 'play', 'end']) $(s).hidden = s !== id;
  document.body.classList.toggle('playing', id === 'play');
  document.body.dataset.screen = id;
  window.scrollTo(0, 0);
}

function showIntro() {
  const r = D.rules;
  const season = esc(D.daily.season);
  $('i-tagline').textContent = T('intro.tagline', { season: D.daily.season });
  // How to play, with the numbers from the rules file (spec 15).
  $('i-howto').innerHTML = [
    TH('intro.howto.1', { band: `<b>${Math.round(r.band * 100)}</b>`, season }),
    TH('intro.howto.2'),
    TH('intro.howto.3', { lives: `<b>${r.lives}</b>`, seconds: `<b>${r.timer_seconds}</b>` }),
    TH('intro.howto.4'),
  ].map((t) => `<li>${t}</li>`).join('');

  const streak = store.get('streak');
  const n = liveStreak(streak, D.daily.date);
  const s = $('i-streak');
  s.hidden = n === 0;
  s.textContent = T(streakAtStake(streak, D.daily.date) ? 'intro.streakAtStake' : 'intro.streak', { n });

  const number = D.daily.number;
  $('i-daily').textContent = dailyResult() ? T('intro.dailyDone')
    : settle('daily') ? T('intro.continueDaily') : T(number ? 'intro.playDailyNumbered' : 'intro.playDaily', { number });
  $('i-unlimited').textContent = T(settle('unlimited') ? 'intro.continueUnlimited' : 'intro.playUnlimited');
  $('i-foot').textContent = [T('salariesAsOf', { date: shortDate(D.daily.salaries_as_of) }),
    D.preview && T('intro.preview')].filter(Boolean).join(' · ');
  showScreen('intro');
  preloadFirstPairs();
}

// ---------------------------------------------------------------------------
// Playing

/** The record for a new game in `mode`. Nothing is saved until it starts. */
function newRecord(mode) {
  const d = D.daily;
  if (mode === 'daily') {
    return { mode, date: d.date, number: d.number, dataDate: d.salaries_as_of, rules: d.rules, seed: d.seed, startId: d.start };
  }
  // Unlimited: a fresh random start every game (spec 11). The seed is rolled
  // ahead, so the intro can download the first pair's photos; the game that
  // starts uses it and the next game gets a new one. C2 takes the seed from
  // the server's start ticket instead.
  D.nextSeed ??= randomHex();
  return { mode, date: d.date, number: null, dataDate: d.salaries_as_of, rules: D.rules, seed: D.nextSeed,
    startId: pickStart(D.pool, D.rules, D.nextSeed) };
}

/**
 * Downloads the first pair of photos of each game the player can start or
 * continue from this screen, so the first clock doesn't wait on them either.
 * Call after settle() has run for both modes.
 */
function preloadFirstPairs() {
  for (const mode of ['daily', 'unlimited']) {
    if (mode === 'daily' && dailyResult()) continue;
    const saved = store.get(liveKey(mode));
    const { state } = rebuild(resumable(saved) ? saved : { ...newRecord(mode), picks: [] });
    if (!isDone(state)) for (const id of [state.incumbent, state.challenger]) preload(D.pool.byId.get(id));
  }
}

function startGame(mode) {
  if (mode === 'daily' && dailyResult()) return showEnd(dailyResult());
  let g = settle(mode);
  if (!g) {
    g = { ...newRecord(mode), picks: [], pending: false, ticket: null };
    if (mode === 'unlimited') D.nextSeed = null;
    store.set(liveKey(mode), g);
  }
  const { state, last } = rebuild(g);
  G = { g, state, last, armed: false, t0: 0, timer: 0, turn: 0 };
  if (isDone(state)) return finish();
  showScreen('play');
  showPick(false);
}

function initials(name) {
  return name.split(/\s+/).map((w) => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
}

const teamName = (p) => TEAMS[p.team] ?? p.team;

/** 'Daily #12', 'Daily' (no number yet) or 'Unlimited'. */
const modeName = (mode, number) =>
  mode !== 'daily' ? T('mode.unlimited') : T(number ? 'mode.dailyNumbered' : 'mode.daily', { number });

const livesLeft = (n) => (n === 1 ? T('lives.one') : T('lives.other', { n }));

/** Position and age. Either is simply left out when the data has none
 * (e.g. a player the Salary Finder has no position for yet). */
function posAge(p) {
  const age = ageOn(p.born, D.daily.date);
  return [p.pos, age === null ? null : T('card.age', { age })].filter(Boolean).join(' · ');
}

const metaLine = (p) => [teamName(p), posAge(p)].filter(Boolean).join(' · ');

function fillCard(el, p, role) {
  el.classList.remove('revealed', 'richer', 'right', 'wrong', 'enter', 'climb');
  const label = T(role === 'inc' ? 'card.incumbent' : 'card.challenger');
  el.setAttribute('aria-label', `${label}: ${p.name}, ${metaLine(p)}`);
  if (el.dataset.id === String(p.id)) {
    el.querySelector('.sal').textContent = '';
    el.querySelector('.gap').textContent = '';
    el.querySelector('.role').textContent = label;
    return;
  }
  el.dataset.id = p.id;
  el.innerHTML =
    `<span class="role">${label}</span>` +
    `<span class="mark" aria-hidden="true"></span>` +
    `<span class="face">${faceImg(p)}<span class="initials">${esc(initials(p.name))}</span></span>` +
    `<span class="pname">${esc(p.name)}</span>` +
    `<span class="pmeta team"><img class="logo" src="${esc(logoUrl(p))}" alt=""><span>${esc(teamName(p))}</span></span>` +
    `<span class="pmeta">${esc(posAge(p)) || '&nbsp;'}</span>` +
    `<span class="sal"></span><span class="gap"></span><span class="more">${esc(T('card.paidMore'))}</span>`;
  el.querySelector('.logo').addEventListener('error', (e) => e.target.remove(), { once: true });
}

/** Resolves once the card's headshot is ready (or failed, or took too long). */
function imageReady(el) {
  const img = el.querySelector('.face img');
  if (!img || img.complete) return Promise.resolve();
  return Promise.race([
    new Promise((r) => {
      img.addEventListener('load', r, { once: true });
      // An error that only switches to the fallback crop isn't the end.
      img.addEventListener('error', () => { if (img.closest('.face').classList.contains('noimg')) r(); });
    }),
    wait(IMAGE_WAIT_MS),
  ]);
}

// Photos downloaded ahead of time, by player ID. Each Image is kept until the
// game ends, so the browser can't drop a download halfway.
const preloaded = new Map();

/** Downloads a player's card photo, following the same crops as the card. */
function preload(p) {
  if (preloaded.has(p.id)) return;
  const urls = photoUrls(p);
  const img = new Image();
  img.onerror = () => { if (urls.length) img.src = urls.shift(); };
  img.src = urls.shift();
  preloaded.set(p.id, img);
}

/**
 * Downloads both possible next challengers while the player decides. The
 * next one is fixed by the seed, the pick number and who holds the rung
 * after this pick: the incumbent (a right "stay", a wrong pick or a
 * timeout) or the challenger (a right climb). So by the time the next pair
 * shows, its photos are already here and the clock doesn't wait on them.
 */
function preloadNext() {
  const { state, g } = G;
  const recent = [...state.recent, state.challenger].slice(-g.rules.recent_no_repeat);
  for (const inc of new Set([state.incumbent, state.challenger])) {
    if (D.pool.byId.get(inc).salary >= D.pool.top) continue; // climbing to the top ends the game
    preload(D.pool.byId.get(nextChallenger(D.pool, g.rules, g.seed, state.pickIndex + 1, inc, recent)));
  }
}

function renderStatus() {
  const { state, g } = G;
  $('p-mode').textContent = modeName(g.mode, g.number);
  const h = $('p-hearts');
  h.innerHTML = Array.from({ length: g.rules.lives }, (_, i) =>
    `<span class="${i < state.lives ? 'full' : 'empty'}">♥</span>`).join('');
  h.setAttribute('aria-label', T('play.livesLabel', { lives: state.lives, max: g.rules.lives }));
  $('p-rung').textContent = state.rung;
  $('p-score').textContent = money(score(D.pool, state));
}

function setTimer(leftMs, maxMs, idle = false) {
  $('t-bar').style.transform = `scaleX(${Math.max(leftMs, 0) / maxMs})`;
  $('t-secs').textContent = T('play.seconds', { n: Math.ceil(Math.max(leftMs, 0) / 1000) });
  $('timer').classList.toggle('warn', !idle && leftMs <= 3000);
  $('timer').classList.toggle('idle', idle);
}

async function showPick(climbed) {
  const { state, g } = G;
  const turn = ++G.turn;
  const maxMs = g.rules.timer_seconds * 1000;
  const inc = $('card-inc'), ch = $('card-ch');
  fillCard(inc, D.pool.byId.get(state.incumbent), 'inc');
  fillCard(ch, D.pool.byId.get(state.challenger), 'ch');
  // Force a reflow so the entrance animation restarts on the same element.
  void ch.offsetWidth;
  ch.classList.add('enter');
  if (climbed) inc.classList.add('climb');
  $('p-result').textContent = '';
  $('p-result').className = 'result';
  renderStatus();
  setTimer(maxMs, maxMs, true);
  // The clock starts once the challenger card is fully on screen (spec 7).
  await Promise.all([wait(reducedMotion() ? 0 : ENTER_MS), imageReady(ch), imageReady(inc)]);
  if (!G || turn !== G.turn) return;
  arm(maxMs);
}

function arm(maxMs) {
  G.armed = true;
  G.t0 = performance.now();
  // Only now, so the next pair's photos never slow down the pair on screen.
  preloadNext();
  G.g.pending = true;
  store.set(liveKey(G.g.mode), G.g);
  G.timer = setTimeout(() => choose(CHOICE.TIMEOUT), maxMs);
  const tick = () => {
    if (!G || !G.armed) return;
    setTimer(maxMs - (performance.now() - G.t0), maxMs);
    requestAnimationFrame(tick);
  };
  tick();
}

function choose(choice) {
  if (!G || !G.armed) return;
  const { g, state } = G;
  const maxMs = g.rules.timer_seconds * 1000;
  let c = choice, ms = maxMs;
  if (choice !== CHOICE.TIMEOUT) {
    const t = pickTiming(performance.now() - G.t0, g.rules);
    if (!t) return; // faster than the minimum: ignored
    if (t.timeout) c = CHOICE.TIMEOUT; else ms = t.ms;
  }
  G.armed = false;
  clearTimeout(G.timer);
  const r = applyPick(D.pool, g.rules, state, c, ms);
  g.picks.push({ c, ms });
  g.pending = false;
  store.set(liveKey(g.mode), g);
  G.last = r;
  reveal(r);
  const turn = G.turn;
  setTimeout(() => {
    if (!G || turn !== G.turn) return;
    if (isDone(G.state)) finish(); else showPick(r.climbed);
  }, g.rules.reveal_ms);
}

function reveal(r) {
  const inc = $('card-inc'), ch = $('card-ch');
  inc.querySelector('.sal').textContent = money(r.incumbentSalary);
  ch.querySelector('.sal').textContent = money(r.challengerSalary);
  ch.querySelector('.gap').textContent = gapText(r.incumbentSalary, r.challengerSalary);
  inc.classList.add('revealed');
  ch.classList.add('revealed');
  (r.challengerSalary > r.incumbentSalary ? ch : inc).classList.add('richer');
  if (r.choice !== CHOICE.TIMEOUT) {
    const picked = r.choice === CHOICE.CHALLENGER ? ch : inc;
    picked.classList.add(r.correct ? 'right' : 'wrong');
    picked.querySelector('.mark').textContent = r.correct ? '✓' : '✗';
  }
  const { state } = G;
  const left = state.over ? T('lives.gameOver') : livesLeft(state.lives);
  const text =
    r.correct && r.climbed ? (state.finished ? T('result.top') : T('result.climb', { rung: state.rung })) :
    r.correct ? T('result.hold') :
    T(r.choice === CHOICE.TIMEOUT ? 'result.timeout' : 'result.wrong', { left });
  $('p-result').textContent = text;
  $('p-result').className = `result ${r.correct ? 'ok' : 'bad'}`;
  setTimer(0, 1, true);
  renderStatus();
}

// The timer keeps running while the tab is hidden (spec 7); catch up on return.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && G && G.armed &&
      performance.now() - G.t0 >= G.g.rules.timer_seconds * 1000) choose(CHOICE.TIMEOUT);
});

document.addEventListener('keydown', (e) => {
  if (!G || $('play').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); choose(CHOICE.INCUMBENT); }
  if (e.key === 'ArrowRight') { e.preventDefault(); choose(CHOICE.CHALLENGER); }
});

// ---------------------------------------------------------------------------
// Game end

function finish() {
  const { g, state, last } = G;
  G = null;
  preloaded.clear();
  const summary = {
    mode: g.mode, date: g.date, number: g.number, dataDate: g.dataDate,
    score: score(D.pool, state), endId: state.incumbent, rung: state.rung,
    livesLeft: state.lives, lives: g.rules.lives, totalMs: state.totalMs, finished: state.finished,
    picks: g.picks.length, pair: last ? [last.incumbent, last.challenger] : null, contract: null,
  };

  // Personal best, one per mode (spec 9).
  const best = store.get('best', {});
  summary.best = Math.max(best[g.mode] ?? 0, summary.score);
  summary.newBest = summary.score > (best[g.mode] ?? 0);
  if (summary.newBest) store.set('best', { ...best, [g.mode]: summary.score });

  if (g.mode === 'daily') {
    store.set('streak', streakAfter(store.get('streak'), g.date));
    store.set('daily', { date: g.date, summary });
  }

  // Today's best game per mode, kept so a name claimed later can back-credit
  // it (spec 12.2). C2 sends it with its start ticket for verification.
  const today = store.get('today', {});
  const prev = today[g.mode];
  if (!prev || prev.date !== D.today || summary.score > prev.score ||
      (summary.score === prev.score && summary.totalMs < prev.totalMs)) {
    today[g.mode] = {
      date: D.today, score: summary.score, totalMs: summary.totalMs, dataDate: g.dataDate,
      rulesVersion: g.rules.version, seed: g.seed, startId: g.startId, picks: g.picks, ticket: g.ticket,
    };
    store.set('today', today);
  }
  store.remove(liveKey(g.mode));
  showEnd(summary);
}

const face = (p) => `<span class="face">${faceImg(p, true)}</span>`;

function playerRow(p) {
  return `${face(p)}<div><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(metaLine(p))}</div></div>`;
}

function showEnd(summary) {
  const end = D.pool.byId.get(summary.endId);
  // The 73-9 record: the big number, then badges, then one line of detail.
  // "You reached" is read out with the number but not shown above it (no eyebrows).
  $('e-score').innerHTML = `<span class="sr">${TH('end.reached')} </span>${money(summary.score)}`;
  const grades = [
    summary.finished && `<span class="grade top">${TH('end.top')}</span>`,
    summary.newBest && `<span class="grade best">${TH('end.newBest')}</span>`,
  ].filter(Boolean);
  $('e-grade').innerHTML = grades.join(' ');
  $('e-grade').hidden = grades.length === 0;
  $('e-sub').innerHTML = TH('end.summary', {
    rung: `<b>${summary.rung}</b>`, left: `<b>${summary.livesLeft}</b>`, lives: `<b>${summary.lives}</b>`, time: `<b>${clock(summary.totalMs)}</b>`,
  });
  $('e-player').innerHTML = end ? playerRow(end) : '';
  $('e-best').innerHTML = TH('end.best', { mode: TH(summary.mode === 'daily' ? 'mode.daily' : 'mode.unlimited'), score: `<b>${money(summary.best)}</b>` });
  // "Higher than X% of today's players" and the boards need the server (C2).
  $('e-rank').textContent = serverOn(D.rules) ? '' : T('end.resting');

  // Name entry: one name per device (spec 12.2).
  const saved = store.get('name');
  $('e-name-input').value = saved?.name ?? '';
  $('e-handle-input').value = saved?.handle ?? '';
  $('e-name-msg').textContent = '';
  $('e-name-msg').className = 'msg';

  showContract(summary);

  $('e-next').textContent = T(summary.mode === 'daily' ? 'end.playUnlimited' : 'end.playAgain');
  $('e-next').onclick = () => startGame('unlimited');
  $('e-share').onclick = () => openShare(summary);
  // Which game this was goes in the footer, not in a label above the score.
  const daily = summary.mode === 'daily';
  $('e-foot').textContent = [
    modeName(summary.mode, summary.number), daily && shortDate(summary.date),
    T('salariesAsOf', { date: shortDate(summary.dataDate) }), D.preview && T('end.previewData'), daily && T('end.nextDaily'),
  ].filter(Boolean).join(' · ');
  showScreen('end');
  preloadFirstPairs(); // for Play again / Play Unlimited
}

function showContract(summary) {
  const box = $('e-contract');
  const pair = summary.pair?.map((id) => D.pool.byId.get(id));
  box.hidden = !pair || pair.some((p) => !p);
  if (box.hidden) return;
  $('e-contract-msg').textContent = '';
  $('e-contract-opts').innerHTML = pair.map((p) =>
    `<button class="opt" type="button" data-id="${p.id}" aria-pressed="${summary.contract === p.id}"${summary.contract ? ' disabled' : ''}>` +
    `${face(p)}<span class="pname">${esc(p.name)}</span><span class="sal">${money(p.salary)}</span></button>`).join('');
  for (const b of box.querySelectorAll('.opt')) {
    b.onclick = () => {
      // One optional tap. Saved with the game; C2 adds it to the game record (spec 14).
      summary.contract = Number(b.dataset.id);
      if (summary.mode === 'daily') store.set('daily', { date: summary.date, summary });
      showContract(summary);
      $('e-contract-msg').textContent = T('contract.thanks');
    };
  }
}

$('e-name').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = cleanName($('e-name-input').value);
  const msg = $('e-name-msg');
  if (!name) {
    msg.textContent = T('name.length');
    msg.className = 'msg err';
    return;
  }
  const handle = cleanHandle($('e-handle-input').value);
  $('e-handle-input').value = handle;
  store.set('name', { name, handle });
  msg.className = 'msg';
  msg.textContent = serverOn(D.rules) ? '' : T('name.savedResting');
});

// ---------------------------------------------------------------------------
// Share (copied from the 73-9 share modal): a drawn picture of the share card,
// the link with Copy, the platform buttons, then Download / Copy / Play again.
// The picture carries exactly what the text card says (spec 9): no player
// names, and no outside images, so the canvas never taints.

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitFont(ctx, text, maxW, weight, px, family, minPx) {
  ctx.font = `${weight} ${px}px ${family}`;
  while (px > minPx && ctx.measureText(text).width > maxW) ctx.font = `${weight} ${px -= 2}px ${family}`;
}

const spacing = (ctx, v) => { try { ctx.letterSpacing = v; } catch { /* older browsers: no tracking */ } };

function heart(ctx, cx, cy, size) {
  const s = size / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.9);
  ctx.bezierCurveTo(cx - s * 1.35, cy + s * 0.05, cx - s * 0.95, cy - s * 1.05, cx, cy - s * 0.4);
  ctx.bezierCurveTo(cx + s * 0.95, cy - s * 1.05, cx + s * 1.35, cy + s * 0.05, cx, cy + s * 0.9);
  ctx.closePath();
}

const DISPLAY = 'Oswald, "DM Sans", sans-serif';
const MONO = '"JetBrains Mono", monospace';

function drawCard(sm) {
  const W = 1080, H = 1350, SS = 2;
  const cv = document.createElement('canvas');
  cv.width = W * SS; cv.height = H * SS;
  const ctx = cv.getContext('2d');
  ctx.scale(SS, SS);
  // Background, top glow and frame: the 73-9 card.
  const bg = ctx.createLinearGradient(0, 0, W * 0.4, H);
  bg.addColorStop(0, '#1a1a3e'); bg.addColorStop(0.55, '#0a0a1a'); bg.addColorStop(1, '#050510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, -120, 40, W / 2, -120, 720);
  glow.addColorStop(0, 'rgba(255,107,53,0.20)'); glow.addColorStop(1, 'rgba(255,107,53,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 460);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  roundRect(ctx, 28, 28, W - 56, H - 56, 30); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

  // Title, and which game (the share text's first line).
  const grd = ctx.createLinearGradient(W / 2 - 400, 0, W / 2 + 400, 0);
  grd.addColorStop(0, '#ff6b35'); grd.addColorStop(0.5, '#ffd700'); grd.addColorStop(1, '#ff6b35');
  const title = T('app.name').toUpperCase();
  spacing(ctx, '4px'); ctx.fillStyle = grd; fitFont(ctx, title, W - 160, 700, 112, DISPLAY, 70);
  ctx.fillText(title, W / 2, 190);
  const which = (sm.mode === 'daily'
    ? `${modeName('daily', sm.number)}  ·  ${shortDate(sm.date)}` : modeName('unlimited')).toUpperCase();
  spacing(ctx, '4px'); ctx.fillStyle = '#ffd84d'; ctx.font = `700 30px ${DISPLAY}`;
  ctx.fillText(which, W / 2, 262);

  // The score, and the rung under it.
  spacing(ctx, '0px'); ctx.fillStyle = '#fff'; fitFont(ctx, money(sm.score), W - 200, 700, 190, DISPLAY, 100);
  ctx.fillText(money(sm.score), W / 2, 470);
  spacing(ctx, '3px'); ctx.fillStyle = '#dcdcf7'; ctx.font = `700 28px ${DISPLAY}`;
  const rung = T('image.rung', { rung: sm.rung });
  ctx.fillText((sm.finished ? `${T('end.top')}  ·  ${rung}` : rung).toUpperCase(), W / 2, 528);

  // The climb: one bar per rung, rising to the last one.
  const n = Math.min(Math.max(sm.rung, 1), 40);
  const x0 = 96, x1 = W - 96, base = 870, top = 590, gap = n > 24 ? 6 : 10;
  const bw = (x1 - x0 - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    const h = sm.rung === 0 ? 24 : 24 + (base - top - 24) * (n === 1 ? 1 : i / (n - 1));
    const x = x0 + i * (bw + gap);
    const fill = ctx.createLinearGradient(0, base - h, 0, base);
    const last = i === n - 1 && sm.rung > 0;
    fill.addColorStop(0, last ? '#ffd700' : 'rgba(255,184,64,0.75)');
    fill.addColorStop(1, last ? '#ff6b35' : 'rgba(255,107,53,0.35)');
    ctx.fillStyle = sm.rung === 0 ? '#2a2a52' : fill;
    roundRect(ctx, x, base - h, bw, h, Math.min(8, bw / 2)); ctx.fill();
  }

  // Lives and time, in two tiles.
  const ty = 920, th = 210, tw = (W - 96 * 2 - 24) / 2;
  for (const [i, label] of [T('image.lives'), T('image.time')].map((l) => l.toUpperCase()).entries()) {
    const tx = 96 + i * (tw + 24);
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; roundRect(ctx, tx, ty, tw, th, 18); ctx.fill();
    spacing(ctx, '3px'); ctx.fillStyle = '#9a9ac8'; ctx.font = `700 24px ${DISPLAY}`;
    ctx.fillText(label, tx + tw / 2, ty + th - 34);
  }
  const hs = 52, hg = 14, hx = 96 + tw / 2 - ((sm.lives - 1) * (hs + hg)) / 2;
  for (let i = 0; i < sm.lives; i++) {
    heart(ctx, hx + i * (hs + hg), ty + 92, hs);
    ctx.fillStyle = i < sm.livesLeft ? '#ff6666' : '#2a2a52'; ctx.fill();
  }
  spacing(ctx, '0px'); ctx.fillStyle = '#ffd700'; ctx.font = `600 76px ${MONO}`;
  ctx.fillText(clock(sm.totalMs), 96 + tw + 24 + tw / 2, ty + 120);

  // Footer.
  const footer = T('image.footer').toUpperCase();
  spacing(ctx, '2px'); ctx.fillStyle = '#aeaed4'; fitFont(ctx, footer, W - 140, 700, 26, DISPLAY, 18);
  ctx.fillText(footer, W / 2, H - 76);
  spacing(ctx, '0px');
  return cv;
}

async function openShare(summary) {
  const text = shareText(summary);
  const links = shareLinks(text);
  // The card uses the page fonts; make sure they're in before drawing.
  await Promise.all([document.fonts.load(`700 100px ${DISPLAY}`), document.fonts.load(`600 70px ${MONO}`)]).catch(() => {});
  let url, blob;
  try {
    const cv = drawCard(summary);
    url = cv.toDataURL('image/png');
    blob = await (await fetch(url)).blob();
  } catch (e) {
    console.warn('share card failed', e);
  }

  $('share-modal')?.remove();
  const ov = document.createElement('div');
  ov.id = 'share-modal';
  ov.className = 'share-modal';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', T('share.dialog'));
  const canCopyImage = Boolean(blob && navigator.clipboard && window.ClipboardItem);
  ov.innerHTML = '<div class="share-box">' +
    `<button class="share-x" type="button" aria-label="${TH('share.close')}">×</button>` +
    (url ? `<img class="share-img" alt="${esc(text.split('\n').slice(0, 3).join('. '))}" src="${url}">` : '') +
    `<div class="share-link"><input class="share-url" readonly value="${esc(SITE_URL)}" aria-label="${TH('share.link')}"><button class="share-copybtn" type="button" data-act="copylink">${TH('share.copyLink')}</button></div>` +
    '<div class="share-social">' + SOCIAL.map(([k, name]) =>
      `<button class="soc soc-${k}" type="button" data-soc="${k}" aria-label="${TH('share.on', { platform: name })}">${SOCIAL_ICON[k]}<span>${name}</span></button>`).join('') + '</div>' +
    '<div class="share-btns">' +
      (blob ? `<button class="btn" type="button" data-act="download">${TH('share.download')}</button>` : '') +
      (canCopyImage ? `<button class="btn ghost" type="button" data-act="copy">${TH('share.copyImage')}</button>` : '') +
      `<button class="btn ghost" type="button" data-act="again">${esc($('e-next').textContent)}</button>` +
    '</div>' +
    '<p class="share-msg" aria-live="polite"></p></div>';
  document.body.appendChild(ov);

  const msg = ov.querySelector('.share-msg');
  const opener = document.activeElement;
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); opener?.focus?.(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
  ov.querySelector('.share-x').onclick = close;
  ov.querySelector('.share-x').focus();
  const field = ov.querySelector('.share-url');
  field.onclick = () => field.select();
  for (const b of ov.querySelectorAll('[data-soc]')) {
    b.onclick = () => window.open(links[b.dataset.soc], '_blank', 'noopener,noreferrer');
  }
  for (const b of ov.querySelectorAll('[data-act]')) {
    b.onclick = async () => {
      const act = b.dataset.act;
      if (act === 'again') { close(); startGame('unlimited'); return; }
      if (act === 'download') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'salary-ladder.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        msg.textContent = T('share.saved');
      } else if (act === 'copy') {
        try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); msg.textContent = T('share.imageCopied'); }
        catch { msg.textContent = T('share.imageBlocked'); }
      } else if (act === 'copylink') {
        // The whole text card (spec 9), the link on its last line.
        try { await navigator.clipboard.writeText(text); msg.textContent = T('share.textCopied'); }
        catch { field.value = text; field.select(); msg.textContent = T('share.textBlocked'); }
      }
    };
  }
}

// ---------------------------------------------------------------------------
// Start

$('card-inc').addEventListener('click', () => choose(CHOICE.INCUMBENT));
$('card-ch').addEventListener('click', () => choose(CHOICE.CHALLENGER));
$('i-daily').addEventListener('click', () => startGame('daily'));
$('i-unlimited').addEventListener('click', () => startGame('unlimited'));
$('e-home').addEventListener('click', showIntro);

load().then(() => {
  // Reload rule first, so a pick that was on the clock is counted even if
  // the player never comes back to that game. A Daily that the timeout
  // ends is finished on the spot.
  for (const mode of ['daily', 'unlimited']) {
    const g = settle(mode);
    if (g && isDone(rebuild(g).state)) {
      const { state, last } = rebuild(g);
      G = { g, state, last };
      finish();
      return;
    }
  }
  showIntro();
}).catch((err) => {
  console.error(err);
  $('loading').textContent = T('app.loadFailed');
});
</script>
